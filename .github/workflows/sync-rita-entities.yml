name: Sync RITA entities from Google Sheets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  sync-rita-entities:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: nora-production-509012
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate RITA snapshot
        working-directory: .
        env:
          GOOGLE_SHEETS_SPREADSHEET_ID: 1C2fgbxQaU0uql-e62bmx5e06xMDnEc-hWIHvLYndI3A
          GOOGLE_SHEETS_WORKSHEET_NAME: ENTITY_RAW
        run: |
          python scripts/sync_rita_entities.py

      - name: Commit changes if needed
        run: |
          if git diff --quiet -- data/rita_entities.json; then
            echo "No changes detected in data/rita_entities.json; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rita_entities.json
          git commit -m "sync RITA entities from Google Sheets"
          git push
